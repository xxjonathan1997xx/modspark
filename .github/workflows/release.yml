# Push a tag like v0.2.0 (matching package.json "version") to build the Windows
# installer and publish it, with latest.yml for auto-update, as a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder leaves the release body empty; set it explicitly (links the code signing policy).
      - name: Set release notes
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --notes "$(node -p "require('./electron-builder.config.cjs').releaseInfo.releaseNotes")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
